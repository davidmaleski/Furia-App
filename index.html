<body>
    <div id="loading">Carregando...</div>
    <div id="firebase-error" style="display:none"></div>
    <div id="app-content">
        <div class="container">
            <script>
                // Função para verificar se o Firebase está inicializado
                function checkFirebaseInitialization() {
                    return new Promise((resolve, reject) => {
                        let attempts = 0;
                        const maxAttempts = 10;
                        
                        function check() {
                            if (firebase.apps.length > 0) {
                                resolve(true);
                            } else if (attempts >= maxAttempts) {
                                reject(new Error('Firebase não inicializou após várias tentativas'));
                            } else {
                                attempts++;
                                setTimeout(check, 500);
                            }
                        }
                        
                        check();
                    });
                }

                // Inicializar o app quando o DOM estiver pronto
                document.addEventListener('DOMContentLoaded', async () => {
                    try {
                        // Aguardar inicialização do Firebase
                        await checkFirebaseInitialization();

                        // Configurar listener de autenticação
                        firebase.auth().onAuthStateChanged((user) => {
                            if (!user) {
                                console.log('Usuário não autenticado, redirecionando...');
                                document.getElementById('loading').style.display = 'none';
                                document.getElementById('firebase-error').style.display = 'block';
                                document.getElementById('firebase-error').textContent = 'Você não está autenticado. Redirecionando para o login...';
                                setTimeout(() => {
                                    window.location.href = 'login.html';
                                }, 1500);
                            } else {
                                console.log('Usuário autenticado:', user.email);
                                document.getElementById('loading').style.display = 'none';
                                document.getElementById('app-content').style.display = 'block';
                                document.getElementById('firebase-error').style.display = 'none';
                                
                                // Atualiza nome e foto do usuário
                                document.getElementById('userName').textContent = user.displayName || 'Usuário FURIA';
                                if (user.photoURL) {
                                    document.getElementById('profileAvatar').src = user.photoURL;
                                }
                                
                                // Mostra a seção do time após o login
                                document.querySelectorAll('.section').forEach(section => {
                                    section.classList.remove('active');
                                });
                                document.getElementById('home').classList.add('active');
                                document.querySelectorAll('.nav-links a').forEach(link => {
                                    link.classList.remove('active');
                                });
                                document.querySelector('.nav-links a[href="#home"]').classList.add('active');

                                // Carregar dados iniciais
                                loadFuriaData();
                            }
                        });
                    } catch (e) {
                        console.error('Erro ao inicializar app:', e);
                        document.getElementById('loading').style.display = 'none';
                        document.getElementById('firebase-error').style.display = 'block';
                        document.getElementById('firebase-error').textContent = 'Erro na inicialização do app: ' + e.message;
                    }
                });
            </script>

    <script>
    async function loadFuriaData() {
        // ATENÇÃO: Substitua 'SUA_SPORTSDATA_API_KEY' pela sua chave da SportsData.io
        const apiKey = 'SUA_SPORTSDATA_API_KEY';
        const baseUrl = 'https://api.sportsdata.io/v3/csgo/scores/json';
        
        try {
            // 1. Buscar todos os times
            const teamsResponse = await fetch(`${baseUrl}/Teams?key=${apiKey}`, {
                headers: { 'Ocp-Apim-Subscription-Key': apiKey }
            });
            
            if (!teamsResponse.ok) {
                throw new Error(`Erro ao buscar times: ${teamsResponse.status}`);
            }
            
            const teams = await teamsResponse.json();
            if (!Array.isArray(teams)) {
                throw new Error('Resposta da API de times inválida');
            }
            
            const furia = teams.find(t => t.Name && t.Name.toLowerCase().includes('furia'));
            if (!furia) {
                throw new Error('Time FURIA não encontrado');
            }

            console.log('FURIA encontrada:', furia);

            // 2. Buscar jogadores
            const playersResponse = await fetch(`${baseUrl}/PlayersByTeam/${furia.TeamId}?key=${apiKey}`, {
                headers: { 'Ocp-Apim-Subscription-Key': apiKey }
            });
            
            if (!playersResponse.ok) {
                throw new Error(`Erro ao buscar jogadores: ${playersResponse.status}`);
            }
            
            const players = await playersResponse.json();
            if (!Array.isArray(players)) {
                throw new Error('Resposta da API de jogadores inválida');
            }

            console.log('Jogadores encontrados:', players.length);

            // 3. Buscar ranking mundial - com tratamento de erro e dados de exemplo
            let worldRanking = {};
            try {
                console.log('Buscando ranking mundial...');
                const rankingResponse = await fetch(`${baseUrl}/TeamRankings?key=${apiKey}`, {
                    headers: { 'Ocp-Apim-Subscription-Key': apiKey }
                });
                
                console.log('Status da resposta do ranking:', rankingResponse.status);
                
                if (rankingResponse.ok) {
                    const rankingData = await rankingResponse.json();
                    console.log('Dados do ranking recebidos:', rankingData);
                    
                    if (Array.isArray(rankingData)) {
                        const furiaRanking = rankingData.find(r => r.TeamId === furia.TeamId);
                        console.log('Ranking da FURIA encontrado:', furiaRanking);
                        
                        if (furiaRanking) {
                            worldRanking = furiaRanking;
                        } else {
                            console.warn('FURIA não encontrada nos rankings. Usando dados de exemplo.');
                            worldRanking = generateSampleRanking();
                        }
                    } else {
                        console.warn('Formato de ranking inválido. Usando dados de exemplo.');
                        worldRanking = generateSampleRanking();
                    }
                } else {
                    console.warn(`Erro ao buscar ranking: ${rankingResponse.status}. Usando dados de exemplo.`);
                    worldRanking = generateSampleRanking();
                }
            } catch (rankingError) {
                console.warn('Erro ao buscar ranking:', rankingError);
                worldRanking = generateSampleRanking();
            }

            // 4. Buscar jogos - com tratamento especial para erro 404
            let games = [];
            try {
                const gamesResponse = await fetch(`${baseUrl}/GamesByTeam/${furia.TeamId}?key=${apiKey}`, {
                    headers: { 'Ocp-Apim-Subscription-Key': apiKey }
                });
                
                if (gamesResponse.ok) {
                    const gamesData = await gamesResponse.json();
                    if (Array.isArray(gamesData)) {
                        games = gamesData;
                    }
                } else if (gamesResponse.status === 404) {
                    console.warn('Endpoint de jogos não disponível (404). Usando dados de exemplo.');
                    games = generateSampleGames(furia.Name);
                } else {
                    console.warn(`Erro ao buscar jogos: ${gamesResponse.status}. Usando dados de exemplo.`);
                    games = generateSampleGames(furia.Name);
                }
            } catch (gamesError) {
                console.warn('Erro ao buscar jogos:', gamesError);
                games = generateSampleGames(furia.Name);
            }

            // 5. Buscar estatísticas da equipe
            let teamStats = {};
            try {
                const statsResponse = await fetch(`${baseUrl}/TeamStats/${furia.TeamId}?key=${apiKey}`, {
                    headers: { 'Ocp-Apim-Subscription-Key': apiKey }
                });
                
                if (statsResponse.ok) {
                    const statsData = await statsResponse.json();
                    if (statsData && typeof statsData === 'object') {
                        teamStats = statsData;
                    }
                } else {
                    console.warn(`Erro ao buscar estatísticas: ${statsResponse.status}. Usando dados de exemplo.`);
                    teamStats = generateSampleStats();
                }
            } catch (statsError) {
                console.warn('Erro ao buscar estatísticas:', statsError);
                teamStats = generateSampleStats();
            }

            // 6. Organizar dados
            const now = new Date();
            const upcomingGames = Array.isArray(games) ? games
                .filter(g => g && g.Day && new Date(g.Day) > now)
                .sort((a, b) => new Date(a.Day) - new Date(b.Day))
                .slice(0, 5) : [];

            const recentGames = Array.isArray(games) ? games
                .filter(g => g && g.Day && new Date(g.Day) <= now)
                .sort((a, b) => new Date(b.Day) - new Date(a.Day))
                .slice(0, 5) : [];

            // 7. Renderizar dados
            console.log('Renderizando dados...');
            renderTeamOverview(furia, players);
            renderTeamStats(teamStats);
            console.log('Renderizando ranking:', worldRanking);
            renderTeamRanking(worldRanking);
            renderMatches(upcomingGames, recentGames);
            
        } catch (error) {
            console.error('Erro ao carregar dados:', error);
            document.getElementById('furiaContainer').innerHTML = `
                <div class="error-message">
                    <p>Erro ao carregar dados da FURIA: ${error.message}</p>
                    <p>Por favor, tente novamente mais tarde.</p>
                </div>
            `;
            
            // Limpar outros containers em caso de erro
            document.getElementById('teamStats').innerHTML = '<p>Não foi possível carregar as estatísticas</p>';
            document.getElementById('teamRanking').innerHTML = '<p>Não foi possível carregar o ranking</p>';
            document.getElementById('upcomingMatches').innerHTML = '<p>Não foi possível carregar os próximos jogos</p>';
            document.getElementById('recentMatches').innerHTML = '<p>Não foi possível carregar os jogos recentes</p>';
        }
    }

    function renderTeamRanking(ranking) {
        console.log('Função renderTeamRanking chamada com:', ranking);
        const container = document.getElementById('teamRanking');
        
        if (!container) {
            console.error('Elemento teamRanking não encontrado no DOM');
            return;
        }
        
        // Se não tiver dados de ranking, use dados de exemplo
        if (!ranking || typeof ranking !== 'object' || Object.keys(ranking).length === 0) {
            console.log('Usando dados de exemplo para o ranking');
            ranking = generateSampleRanking();
        }
        
        console.log('Renderizando ranking com dados:', ranking);
        
        container.innerHTML = `
            <div class="ranking-info">
                <p>Ranking atual: <span class="ranking-value">#${ranking.Rank || 'N/A'}</span></p>
                <p>Pontos: <span class="ranking-value">${ranking.Points || 'N/A'}</span></p>
                ${ranking.PreviousRank ? `<p>Ranking anterior: <span class="ranking-value">#${ranking.PreviousRank}</span></p>` : ''}
                ${ranking.RankChange ? `<p>Variação: <span class="ranking-value ${ranking.RankChange > 0 ? 'positive' : 'negative'}">${ranking.RankChange > 0 ? '+' : ''}${ranking.RankChange}</span></p>` : ''}
            </div>
        `;
        
        console.log('HTML do ranking gerado:', container.innerHTML);
    }

    function renderMatches(upcoming, recent) {
        const upcomingContainer = document.getElementById('upcomingMatches');
        const recentContainer = document.getElementById('recentMatches');

        if (!Array.isArray(upcoming)) {
            upcomingContainer.innerHTML = '<p>Não foi possível carregar os próximos jogos</p>';
            return;
        }

        if (!Array.isArray(recent)) {
            recentContainer.innerHTML = '<p>Não foi possível carregar os jogos recentes</p>';
            return;
        }

        upcomingContainer.innerHTML = upcoming.length ? upcoming.map(game => `
            <div class="match-card upcoming">
                <div class="match-date">${new Date(game.Day).toLocaleDateString('pt-BR')}</div>
                <div class="match-teams">
                    <span class="team">${game.HomeTeam || 'TBD'}</span>
                    <span class="vs">vs</span>
                    <span class="team">${game.AwayTeam || 'TBD'}</span>
                </div>
                <div class="match-status">${game.Status || 'Agendado'}</div>
            </div>
        `).join('') : '<p>Nenhum jogo futuro encontrado</p>';

        recentContainer.innerHTML = recent.length ? recent.map(game => `
            <div class="match-card recent">
                <div class="match-date">${new Date(game.Day).toLocaleDateString('pt-BR')}</div>
                <div class="match-teams">
                    <span class="team">${game.HomeTeam || 'TBD'}</span>
                    <span class="score">${game.HomeTeamScore || 0} - ${game.AwayTeamScore || 0}</span>
                    <span class="team">${game.AwayTeam || 'TBD'}</span>
                </div>
                <div class="match-status">${game.Status || 'Finalizado'}</div>
            </div>
        `).join('') : '<p>Nenhum jogo recente encontrado</p>';
    }

    // Função para gerar dados de exemplo de jogos
    function generateSampleGames(teamName) {
        const now = new Date();
        const upcomingGames = [];
        const recentGames = [];
        
        // Times de exemplo
        const opponents = [
            'NAVI', 'FaZe', 'Vitality', 'G2', 'Liquid', 
            'ENCE', 'Heroic', 'Cloud9', 'MOUZ', 'Complexity'
        ];
        
        // Gerar 5 jogos futuros
        for (let i = 0; i < 5; i++) {
            const gameDate = new Date(now);
            gameDate.setDate(now.getDate() + (i + 1) * 7); // Um jogo por semana
            
            upcomingGames.push({
                Day: gameDate.toISOString(),
                HomeTeam: Math.random() > 0.5 ? teamName : opponents[Math.floor(Math.random() * opponents.length)],
                AwayTeam: Math.random() > 0.5 ? teamName : opponents[Math.floor(Math.random() * opponents.length)],
                Status: 'Agendado'
            });
        }
        
        // Gerar 5 jogos recentes
        for (let i = 0; i < 5; i++) {
            const gameDate = new Date(now);
            gameDate.setDate(now.getDate() - (i + 1) * 7); // Um jogo por semana no passado
            
            const homeScore = Math.floor(Math.random() * 16);
            const awayScore = Math.floor(Math.random() * 16);
            
            recentGames.push({
                Day: gameDate.toISOString(),
                HomeTeam: Math.random() > 0.5 ? teamName : opponents[Math.floor(Math.random() * opponents.length)],
                AwayTeam: Math.random() > 0.5 ? teamName : opponents[Math.floor(Math.random() * opponents.length)],
                HomeTeamScore: homeScore,
                AwayTeamScore: awayScore,
                Status: 'Finalizado'
            });
        }
        
        return [...upcomingGames, ...recentGames];
    }
